<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オフライン | SHINONOI DEPOT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <header class="navbar navbar-expand-lg fixed-top border-bottom bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-dark" href="index.html">SHINONOI DEPOT</a>
        </div>
    </header>

    <main class="container py-5 d-flex align-items-center justify-content-center" style="min-height: 80vh;">
        <div class="text-center p-5 bg-white rounded-5 shadow-sm border" style="max-width: 600px;">
            <div class="mb-4">
                <i class="bi bi-wifi-off display-1 text-secondary"></i>
            </div>
            <h1 class="fw-bold h3 mb-3">オフライン状態です</h1>
            <p class="text-muted mb-5">
                現在、インターネットに接続されていないようです。<br>
                接続が回復すると、自動的に最新の情報に更新されます。
            </p>
            
            <div class="card bg-light border-0 rounded-4 p-3 mb-4 text-start">
                <h6 class="fw-bold small mb-2"><i class="bi bi-info-circle me-1"></i> オフラインでも閲覧可能なページ:</h6>
                <ul class="small text-secondary mb-0">
                    <li>トップページ（一部）</li>
                    <li>ご利用ガイド</li>
                    <li>利用規約 / プライバシーポリシー</li>
                </ul>
            </div>

            <button onclick="window.location.reload()" class="btn btn-primary btn-lg rounded-pill px-5">再試行する</button>
        </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <p class="small mb-0">&copy; 2026 SHINONOI DEPOT - Offline Mode</p>
        </div>
    </footer>
</body>
</html>
