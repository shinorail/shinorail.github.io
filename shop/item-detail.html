<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>製品詳細 | SHINONOI DEPOT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container py-5">
        <div class="row g-5">
            <div class="col-lg-7">
                <div class="detail-img-box rounded-4 border bg-white d-flex align-items-center justify-content-center" style="height: 450px;">
                    <i class="bi bi-file-earmark-zip display-1 text-secondary"></i>
                </div>
            </div>
            <div class="col-lg-5">
                <h1 class="fw-bold" id="detailName">Loading Asset...</h1>
                <p class="badge bg-primary fs-6">FREE DISTRIBUTION</p>
                <div class="p-4 bg-white border rounded-4 my-4">
                    <h5 class="fw-bold">配布ステータス</h5>
                    <p class="text-success fw-bold"><i class="bi bi-check-circle-fill"></i> 利用可能</p>
                    <button class="btn btn-dark w-100 py-3 fw-bold rounded-pill" onclick="app.addFromDetail()">ダウンロードリストに追加</button>
                </div>
                <h6>製品説明</h6>
                <p class="text-muted small">本アセットは商用プロジェクトでの利用を想定した高精度なテンプレートです。スクリプト、3Dモデル、マニュアルが同梱されています。</p>
            </div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
