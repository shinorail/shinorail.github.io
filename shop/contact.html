<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>お問い合わせ | SHINONOI DEPOT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container py-5">
        <div class="max-w-700 mx-auto bg-white border rounded-4 p-5 shadow-sm">
            <h1 class="fw-bold mb-4">Contact</h1>
            <form id="contactForm">
                <div class="mb-3"><label class="form-label fw-bold">氏名</label><input type="text" class="form-control" required></div>
                <div class="mb-3"><label class="form-label fw-bold">メールアドレス</label><input type="email" class="form-control" required></div>
                <div class="mb-3"><label class="form-label fw-bold">お問い合わせ内容</label><textarea class="form-control" rows="6" required></textarea></div>
                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill">メッセージを送信</button>
            </form>
        </div>
    </main>
</body>
</html>
