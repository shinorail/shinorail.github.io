<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHINONOI STORE | Official</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root { --accent: #ff004c; --bg-yellow: #fff3c4; }
        body { font-family: "Hiragino Sans", sans-serif; background: #fff; color: #333; }
        
        /* Navbar */
        .navbar { border-bottom: 2px solid #000; background: #fff; }
        .nav-link { font-weight: bold; font-size: 0.9rem; }

        /* Pop Decor */
        .section-title { position: relative; font-family: 'Arial Black', sans-serif; font-size: 2.5rem; text-align: center; margin-bottom: 40px; }
        .section-icon { position: absolute; top: -20px; right: 10%; width: 50px; height: 50px; border: 2px solid #000; background: #fff; border-radius: 8px; }

        /* Items */
        .item-card { border: none; border-radius: 15px; overflow: hidden; background: #fff; transition: 0.2s; }
        .item-img { aspect-ratio: 1/1; background: #f0f0f0; border: 2px solid #eee; border-radius: 15px; display: flex; align-items: center; justify-content: center; position: relative; }
        .badge-coming { position: absolute; top: 10px; left: 10px; background: #000; color: #fff; padding: 5px 10px; font-weight: bold; font-size: 0.7rem; }
        
        /* Information Section */
        .news-box { background: var(--bg-yellow); border-radius: 20px; padding: 40px 20px; margin-top: 50px; }
        .news-list { background: #fff; border-radius: 15px; padding: 20px; }
        .news-date { background: var(--accent); color: #fff; padding: 2px 10px; border-radius: 5px; font-size: 0.8rem; margin-right: 10px; }

        /* Guide Buttons */
        .guide-btn { border: 3px solid; border-radius: 12px; padding: 20px; font-weight: bold; text-align: center; display: block; text-decoration: none; position: relative; }
        
        /* Footer */
        footer { background: #000; color: #fff; padding: 60px 20px; }
        .footer-link { color: #fff; text-decoration: none; font-size: 0.8rem; margin: 0 10px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">SHINONOI STORE</a>
        <div class="d-flex align-items-center">
            <button class="btn btn-outline-dark btn-sm me-2" onclick="toggleLang()" id="langBtn">ENGLISH</button>
            <button class="btn border-0 position-relative" data-bs-toggle="offcanvas" data-bs-target="#cartBox">
                <i class="bi bi-cart3 fs-4"></i>
                <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
            </button>
        </div>
    </div>
</nav>

<main class="container py-5">
    
    <div class="p-5 mb-5 bg-light rounded-5 text-center border">
        <h2 data-t="hero">NEW ARRIVAL Assets</h2>
    </div>

    <div class="row g-3 mb-5">
        <div class="col-6 col-md-3"><a href="#" class="guide-btn border-primary text-primary" data-t="g_reg">会員登録</a></div>
        <div class="col-6 col-md-3"><a href="#" class="guide-btn border-warning text-warning" data-t="g_guide">ご利用ガイド</a></div>
        <div class="col-6 col-md-3"><a href="#" class="guide-btn border-info text-info" data-t="g_faq">よくある質問</a></div>
        <div class="col-6 col-md-3"><a href="#" class="guide-btn border-danger text-danger" data-t="g_info">お知らせ</a></div>
    </div>

    <div class="section-title">NEW GOODS <span class="section-icon">📦</span></div>
    <div class="row g-4" id="itemList"></div>

    <div class="news-box">
        <div class="section-title">INFORMATION <span class="section-icon">🔔</span></div>
        <div class="news-list" id="newsList"></div>
    </div>

</main>

<footer class="text-center">
    <div class="mb-4">
        <a href="#" class="footer-link" data-t="f1">利用規約</a>
        <a href="#" class="footer-link" data-t="f2">プライバシーポリシー</a>
        <a href="#" class="footer-link" data-t="f3">会社概要</a>
    </div>
    <h3 class="fw-bold mb-4">SHINONOI DEPOT</h3>
    <div class="fs-2 mb-4">
        <i class="bi bi-twitter-x mx-2"></i><i class="bi bi-youtube mx-2"></i><i class="bi bi-instagram mx-2"></i>
    </div>
    <p class="small text-secondary">&copy; SHINONOI DEPOT Corp.</p>
</footer>

<div class="offcanvas offcanvas-end" tabindex="-1" id="cartBox">
    <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title" data-t="g_cart">カート</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body" id="cartBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const i18n = {
        ja: {
            hero: "新作アセット登場", g_reg: "会員登録", g_guide: "ご利用ガイド", g_faq: "よくある質問", g_info: "お知らせ",
            g_cart: "カート", f1: "利用規約", f2: "プライバシーポリシー", f3: "会社概要", add: "カートに入れる",
            coming: "近日発売", empty: "カートは空です"
        },
        en: {
            hero: "NEW ASSETS AVAILABLE", g_reg: "Register", g_guide: "Guide", g_faq: "FAQ", g_info: "News",
            g_cart: "Cart", f1: "Terms", f2: "Privacy", f3: "Company", add: "Add to Cart",
            coming: "COMING SOON", empty: "Cart is empty"
        }
    };

    const items = [
        { id: 1, name: {ja:"開発者用ツールパック", en:"Dev Tool Pack"}, price: 3000, status: "sale" },
        { id: 2, name: {ja:"限定UIアセット Vol.2", en:"Limited UI Vol.2"}, price: 1500, status: "coming" },
        { id: 3, name: {ja:"システム構成図テンプレート", en:"Architecture Template"}, price: 2000, status: "sale" }
    ];

    const news = [
        { date: "2026.05.19", text: {ja:"2026年度「新作グッズ」販売開始のお知らせ", en:"Notice of 2026 New Goods Sale"} },
        { date: "2026.04.10", text: {ja: "ゴールデンウィーク休業のお知らせ", en: "Golden Week Holiday Notice"} }
    ];

    let lang = localStorage.getItem('s_lang') || 'ja';
    let cart = JSON.parse(localStorage.getItem('s_cart')) || [];

    function updateUI() {
        document.querySelectorAll('[data-t]').forEach(el => {
            const key = el.getAttribute('data-t');
            el.textContent = i18n[lang][key];
        });
        document.getElementById('langBtn').textContent = lang === 'ja' ? 'ENGLISH' : '日本語';
        renderItems();
        renderNews();
        renderCart();
    }

    function toggleLang() { lang = lang === 'ja' ? 'en' : 'ja'; localStorage.setItem('s_lang', lang); updateUI(); }

    function renderItems() {
        document.getElementById('itemList').innerHTML = items.map(p => `
            <div class="col-6 col-md-4">
                <div class="item-card">
                    <div class="item-img">
                        ${p.status === 'coming' ? `<span class="badge-coming">${i18n[lang].coming}</span>` : ''}
                        <i class="bi bi-box-seam display-1 text-secondary"></i>
                    </div>
                    <div class="p-2">
                        <div class="fw-bold small">${p.name[lang]}</div>
                        <div class="fw-bold">¥${p.price.toLocaleString()}</div>
                        <button class="btn btn-outline-danger btn-sm w-100 mt-2" onclick="addToCart(${p.id})" ${p.status === 'coming' ? 'disabled' : ''}>
                            ${p.status === 'coming' ? i18n[lang].coming : i18n[lang].add}
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function renderNews() {
        document.getElementById('newsList').innerHTML = news.map(n => `
            <div class="py-2 border-bottom">
                <span class="news-date">${n.date}</span>
                <span class="small fw-bold">${n.text[lang]}</span>
            </div>
        `).join('');
    }

    function addToCart(id) {
        cart.push(items.find(p => p.id === id));
        saveCart();
    }

    function saveCart() {
        localStorage.setItem('s_cart', JSON.stringify(cart));
        document.getElementById('cartCount').textContent = cart.length;
        renderCart();
    }

    function renderCart() {
        const body = document.getElementById('cartBody');
        if (cart.length === 0) { body.innerHTML = `<p>${i18n[lang].empty}</p>`; return; }
        body.innerHTML = cart.map((item, idx) => `
            <div class="d-flex justify-content-between mb-2 small">
                <span>${item.name[lang]}</span>
                <span>¥${item.price} <i class="bi bi-x-circle text-danger" onclick="removeCart(${idx})"></i></span>
            </div>
        `).join('');
    }

    function removeCart(idx) { cart.splice(idx, 1); saveCart(); }

    updateUI();
    document.getElementById('cartCount').textContent = cart.length;
</script>
</body>
</html>
