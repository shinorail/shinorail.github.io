<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>認証 | SHINONOI DEPOT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <main class="container py-5 d-flex align-items-center justify-content-center" style="min-height: 80vh;">
        <div class="card p-5 border-0 shadow-lg rounded-4 text-center" style="max-width: 450px;">
            <i class="bi bi-shield-lock-fill display-1 text-primary mb-3"></i>
            <h1 class="h4 fw-bold">限定ページ認証</h1>
            <p class="small text-muted mb-4">このコンテンツを表示するには招待コードが必要です。</p>
            <div class="mb-3">
                <input type="password" id="passInput" class="form-control form-control-lg text-center" placeholder="Invite Code">
            </div>
            <button class="btn btn-primary w-100 py-3 fw-bold rounded-pill" onclick="app.verifyCode()">認証を解除</button>
            <div id="authError" class="text-danger mt-3 d-none small">コードが一致しません。</div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
