<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メンテナンス中 | 篠ノ井乗務区</title>

    <!-- フォントの事前読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/style.css">
    
    <style>
        /* フェードインアニメーション（JSなしで安全に動作） */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        .responsive-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 16px;
            box-sizing: border-box;
            text-align: center;
        }

        .maintenance-text {
            margin-top: 16px;
            font-size: 1rem;
            line-height: 1.7;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            margin-top: 30px;
        }

        /* ボタン共通スタイル */
        .btn-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 18px 16px;
            border-radius: 12px;
            text-decoration: none;
            box-sizing: border-box;
            text-align: center;
            font-weight: bold;
            transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-card:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-title-main { font-size: 1.1rem; }
        .btn-title-sec  { font-size: 1rem; }
        .btn-title-info { font-size: 0.95rem; }

        /* 1. メインサイトボタン */
        .btn-primary {
            background-color: #0056b3;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(0, 86, 179, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 16px rgba(0, 86, 179, 0.4);
        }

        /* 2. 最新情報・メンテナンス状況ボタン */
        .btn-secondary {
            background-color: #ffffff;
            color: #333333 !important;
            border: 2px solid #0056b3;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .btn-secondary:hover {
            background-color: #f8f9fa;
        }

        /* 3. リニューアル予定インフォ */
        .btn-info {
            background-color: #f1f3f5;
            color: #495057;
            border: 2px dashed #ced4da;
            cursor: default;
        }

        .btn-info-date {
            font-size: 1.1rem;
            color: #d9534f;
            margin-top: 4px;
        }

        /* サブテキスト */
        .btn-subtext {
            font-size: 0.825rem;
            font-weight: normal;
            margin-top: 6px;
            opacity: 0.9;
        }

        /* モバイル対応 */
        @media (max-width: 480px) {
            .responsive-container {
                padding: 24px 12px;
            }
            .section-title {
                font-size: 1.5rem;
            }
            .btn-card {
                padding: 16px 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">篠ノ井乗務区 <span>S.R.C.C.</span></div>
</header>

<main>
    <section class="container responsive-container fade-in">
        <h1 class="section-title">🔧 メンテナンス中</h1>
        
        <p class="maintenance-text">
            現在、篠ノ井乗務区公式サイトは<br>
            <strong>全面リニューアル作業中</strong> です。
        </p>

        <div class="btn-group">
            <a href="https://shinorail.github.io/main/" class="btn-card btn-primary">
                <span class="btn-title-main">🏠 メインサイトを開く</span>
                <span class="btn-subtext">※10月の改修完了まではこちらをご利用ください</span>
            </a>

            <a href="https://shinorail.github.io/main/maintenance/" class="btn-card btn-secondary">
                <span class="btn-title-sec">📢 最新情報・メンテナンス状況</span>
                <span class="btn-subtext">作業中の詳細や変更点はこちら</span>
            </a>

            <div class="btn-card btn-info">
                <span class="btn-title-info">🗓️ 修正・リニューアル予定</span>
                <span class="btn-info-date">2026年 10月 完成予定</span>
            </div>
        </div>
    </section>
</main>

<footer>
    <p>&copy; 2026 篠ノ井乗務区 Shinonoi Rail Crew Creative</p>
</footer>

</body>
</html>
