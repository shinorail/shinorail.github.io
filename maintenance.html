<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メンテナンス中 | 篠ノ井乗務区</title>
    <link rel="stylesheet" href="/style.css">
    
    <style>
        .responsive-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 16px;
            box-sizing: border-box;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            margin-top: 30px;
        }

        /* 全てのボタン共通スタイル */
        .btn-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 18px 16px;
            border-radius: 12px;
            text-decoration: none;
            box-sizing: border-box;
            text-align: center;
            font-weight: bold;
            transition: transform 0.15s ease, opacity 0.15s ease;
            /* スマホでのタップ反応を良くする設定 */
            -webkit-tap-highlight-color: transparent;
        }

        .btn-card:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        /* 1. メインサイトボタン（一番目立つ） */
        .btn-primary {
            background-color: #0056b3;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(0, 86, 179, 0.3);
        }

        /* 2. 最新情報・メンテナンス状況ボタン */
        .btn-secondary {
            background-color: #ffffff;
            color: #333333 !important;
            border: 2px solid #0056b3;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        /* 3. リニューアル予定インフォボタン（押し込み表示） */
        .btn-info {
            background-color: #f1f3f5;
            color: #495057;
            border: 2px dashed #ced4da;
            cursor: default;
        }

        /* サブテキスト用 */
        .btn-subtext {
            font-size: 0.825rem;
            font-weight: normal;
            margin-top: 6px;
            opacity: 0.9;
        }

        /* スマホ向け微調整 */
        @media (max-width: 480px) {
            .responsive-container {
                padding: 24px 12px;
            }
            .section-title {
                font-size: 1.5rem;
            }
            .btn-card {
                padding: 16px 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">篠ノ井乗務区 <span>S.R.C.C.</span></div>
</header>

<main>
    <section class="container responsive-container fade-in" style="text-align:center;">
        <h1 class="section-title">🔧 メンテナンス中</h1>
        
        <p style="margin-top:16px; font-size:1rem; line-height:1.7;">
            現在、篠ノ井乗務区公式サイトは<br>
            <strong>全面リニューアル作業中</strong> です。
        </p>

        <div class="btn-group">
            
            <a href="http://shinorail.github.io/main/" class="btn-card btn-primary">
                <span style="font-size: 1.1rem;">🏠 メインサイトを開く</span>
                <span class="btn-subtext">※10月の改修完了まではこちらをご利用ください</span>
            </a>

            <a href="http://shinorail.github.io/main/maintenance/" class="btn-card btn-secondary">
                <span style="font-size: 1rem;">📢 最新情報・メンテナンス状況</span>
                <span class="btn-subtext">作業中の詳細や変更点はこちら</span>
            </a>

            <div class="btn-card btn-info">
                <span style="font-size: 0.95rem;">🗓️ 修正・リニューアル予定</span>
                <span style="font-size: 1.1rem; color: #d9534f; margin-top: 4px;">2026年 10月 完成予定</span>
            </div>

        </div>
    </section>
</main>

<footer>
    <p>&copy; 2026 篠ノ井乗務区 Shinonoi Rail Crew Creative</p>
</footer>

</body>
</html>
