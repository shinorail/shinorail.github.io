<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINKS | Shinorail-Group</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .link-container { max-width: 500px; margin: 40px auto; padding: 20px; text-align: center; }
        .link-button {
            display: flex; align-items: center; justify-content: center;
            width: 100%; padding: 18px; margin-bottom: 15px; border-radius: 15px;
            color: white; text-decoration: none; font-weight: bold; font-size: 1.1rem;
            transition: transform 0.2s, box-shadow 0.2s; border: none;
        }
        .link-button i { margin-right: 15px; font-size: 1.2rem; }
        .link-button:hover { transform: scale(1.03); box-shadow: 0 5px 15px rgba(0,255,191,0.3); }

        /* 各ボタンのカラー指定 */
        .btn-multi { background-color: #b09343; }
        .btn-official { background-color: #44d35d; }
        .btn-lab { background-color: #333333; border: 1px solid #444; }
        .btn-twitter { background-color: #4da3f1; }
        .btn-contact { background-color: #7d91a1; }
        
        .ad-space { background: var(--bg-card); border-radius: 15px; padding: 40px; margin-top: 30px; border: 1px dashed #444; color: #555; }
    </style>
</head>
<body>

<header>
    <div class="logo">篠ノ井乗務区 <span>S.R.C.C.</span></div>
    <button class="hamburger" id="js-hamburger">
        <span></span><span></span><span></span>
    </button>
    <nav id="js-nav"></nav>
</header>

<main>
    <div class="link-container">
        <h2 style="margin-bottom: 30px; letter-spacing: 2px;">Shinonail-Group</h2>
        
        <a href="#" class="link-button btn-multi"><i class="fas fa-microchip"></i> Multi-X Utility</a>
        <a href="index.html" class="link-button btn-official"><i class="fab fa-google"></i> 篠ノ井乗務区 公式（新）</a>
        <a href="https://github.com/shinorail" class="link-button btn-lab"><i class="fab fa-github"></i> しのれーるらぼ</a>
        <a href="https://twitter.com/shinorail" class="link-button btn-twitter"><i class="fab fa-x-twitter"></i> 篠ノ井乗務区 Twitter</a>
        <a href="#" class="link-button btn-contact"><i class="fas fa-envelope"></i> お問い合わせ</a>

        <div class="ad-space">
            <p style="font-size: 0.8rem;">ADVERTISEMENT</p>
            </div>
    </div>
</main>

<footer>
    <p>&copy; 篠ノ井乗務区 Shinonoi Rail Crew Creative</p>
</footer>

<script src="menu.js"></script>
</body>
</html>
